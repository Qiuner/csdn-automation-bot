services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: csdn-automation-bot:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:6088:6080"
    volumes:
      - browser-state:/app/web/Chrome
    shm_size: 256mb
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  browser-state:
